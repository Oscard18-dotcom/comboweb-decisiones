services:
  - type: web
    name: comboweb-decisiones
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm run start:nube
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MODO_DEMO
        value: "true"
      - key: PAYMENT_PROVIDER
        value: simulado
      - key: MAIL_PROVIDER
        value: consola
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
